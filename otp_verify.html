<!DOCTYPE html>
<html>
<head>
    <title>Verify OTP</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:#f5f7fb;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .card{
            background:white;
            width:400px;
            padding:30px;
            border-radius:12px;
            text-align:center;
            box-shadow:0 4px 15px rgba(0,0,0,0.1);
        }

        h2{
            margin-bottom:10px;
        }

        p{
            color:#666;
            margin-bottom:25px;
        }

        .otp-box{
            display:flex;
            justify-content:center;
            gap:10px;
            margin-bottom:25px;
        }

        .otp-box input{
            width:50px;
            height:50px;
            text-align:center;
            font-size:20px;
            border:1px solid #ccc;
            border-radius:8px;
        }

        button{
            width:100%;
            padding:12px;
            border:none;
            border-radius:8px;
            background:#2563eb;
            color:white;
            cursor:pointer;
        }

        button:hover{
            background:#1d4ed8;
        }

        .resend{
            margin-top:15px;
            color:#2563eb;
            cursor:pointer;
        }

    </style>
</head>

<body>

<div class="card">

    <h2>Email Verification</h2>

    <p>
        Enter the OTP sent to your email.
    </p>

    <div class="otp-box">
        <input maxlength="1">
        <input maxlength="1">
        <input maxlength="1">
        <input maxlength="1">
        <input maxlength="1">
        <input maxlength="1">
    </div>

    <button>
        Verify OTP
    </button>

    <div class="resend">
        Resend OTP
    </div>

</div>

</body>
</html>
