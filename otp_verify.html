<!DOCTYPE html>
<html>
<head>
    <title>Verify OTP</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:#f5f7fb;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .card{
            background:white;
            width:400px;
            padding:30px;
            border-radius:12px;
            text-align:center;
            box-shadow:0 4px 15px rgba(0,0,0,0.1);
        }

        h2{
            margin-bottom:10px;
        }

        p{
            color:#666;
            margin-bottom:25px;
        }

        .otp-box{
            display:flex;
            justify-content:center;
            gap:10px;
            margin-bottom:25px;
        }

        .otp-box input{
            width:50px;
            height:50px;
            text-align:center;
            font-size:20px;
            border:1px solid #ccc;
            border-radius:8px;
        }

        button{
            width:100%;
            padding:12px;
            border:none;
            border-radius:8px;
            background:#2563eb;
            color:white;
            cursor:pointer;
        }

        button:hover{
            background:#1d4ed8;
        }

        .resend{
            margin-top:15px;
            color:#2563eb;
            cursor:pointer;
        }

    </style>
</head>

<body>

<div class="card">

    <h2>Email Verification</h2>

    <p>
        Enter the OTP sent to <b><span id="email-text"></span></b>.
    </p>

    <div class="otp-box">
        <input id="in1" maxlength="1">
        <input id="in2" maxlength="1">
        <input id="in3" maxlength="1">
        <input id="in4" maxlength="1">
        <input id="in5" maxlength="1">
        <input id="in6" maxlength="1">
    </div>

    <button onclick="verifyOtp(event)">
        Verify OTP
    </button>

    <div class="resend">
        Resend OTP
    </div>

</div>

</body>
<script>
    const email = sessionStorage.getItem("email");
    document.getElementById("email-text").textContent = email;
    

    const otpInputs = document.querySelectorAll('.otp-box input');
    otpInputs.forEach((input, index) => {

        input.addEventListener('input', () => {
            if (
                input.value.length === 1 &&
                index < otpInputs.length - 1
            ) {
                otpInputs[index + 1].focus();
            }
        });

        input.addEventListener('keydown', (e) => {
            if (
                e.key === 'Backspace' &&
                input.value === '' &&
                index > 0
            ) {
                otpInputs[index - 1].focus();
            }
        });

    });


    const verifyOtp = async (e) => {
        e.preventDefault();
        const otp = document.getElementById('in1').value +
                    document.getElementById('in2').value + 
                    document.getElementById('in3').value + 
                    document.getElementById('in4').value + 
                    document.getElementById('in5').value + 
                    document.getElementById('in6').value;

        try{
            const result = await fetch(
                '/api/verify_otp',
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        "email": email,
                        "otp": otp
                    })
                }
            )
            if (result.ok) {
                const data = await result.json();
                if(data.message === "OTP Verified"){
                    sessionStorage.removeItem('email');
                    window.location.href = "/home.html";
                }
            } else {
                alert("OTP verification failed");
            }
        }catch(err){
            console.log(err);
            alert("Server Error");
        }

        
    }
</script>
</html>
