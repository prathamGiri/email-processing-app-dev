<!DOCTYPE html>
<html>
<head>
    <title>Auth</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:#f5f7fb;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            width:400px;
            background:white;
            padding:30px;
            border-radius:12px;
            box-shadow:0 4px 15px rgba(0,0,0,0.1);
        }

        h2{
            text-align:center;
            margin-bottom:20px;
        }

        .tabs{
            display:flex;
            margin-bottom:20px;
        }

        .tab{
            flex:1;
            padding:10px;
            border:none;
            cursor:pointer;
            background:#eee;
        }

        .active{
            background:#2563eb;
            color:white;
        }

        form{
            display:flex;
            flex-direction:column;
            gap:15px;
        }

        input{
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
        }

        button.submit{
            padding:12px;
            border:none;
            border-radius:8px;
            background:#2563eb;
            color:white;
            cursor:pointer;
        }

        button.submit:hover{
            background:#1d4ed8;
        }

        .hidden{
            display:none;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="tabs">
        <button class="tab active" onclick="showLogin()">Login</button>
        <button class="tab" onclick="showRegister()">Register</button>
    </div>

    <div id="loginForm">
        <h2>Login</h2>

        <form onsubmit="login_submit(event)">
            <input type="email" id="login_email" placeholder="Email" required>
            <input type="password" id="login_password" placeholder="Password" required>

            <button class="submit" type="submit">
                Sign In
            </button>
        </form>
    </div>

    <div id="registerForm" class="hidden">
        <h2>Register</h2>

        <form onsubmit="register_submit(event)">
            <input type="text" id="register_name" placeholder="Full Name" required>
            <input type="email" id="register_email" placeholder="Email" required>
            <input type="password" id="register_password" placeholder="Password" required>

            <button class="submit" type="submit" >
                Create Account
            </button>
        </form>
    </div>

</div>

<script>
    async function register_submit(event){
        event.preventDefault();
        var fullname = document.getElementById('register_name').value;
        var email = document.getElementById('register_email').value;
        var password = document.getElementById('register_password').value;
        const response = await fetch(
            "/api/register",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    "fullname": fullname,
                    "email": email,
                    "password": password
                })
            }
        )

        const data = await response.json();

        console.log(data);

        if(data.message == "OTP Sent"){
            sessionStorage.setItem("email", email);
            window.location.href = "/otp_verify.html";
        }
    }

    async function login_submit(event){
        event.preventDefault();
        var email = document.getElementById('login_email').value;
        var password = document.getElementById('login_password').value;
        const response = await fetch(
            "/api/login",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    "email": email,
                    "password": password
                })
            }
        )

        const data = await response.json();

        console.log(data);
    }

const tabs=document.querySelectorAll(".tab");

function showLogin(){
    document.getElementById("loginForm").classList.remove("hidden");
    document.getElementById("registerForm").classList.add("hidden");

    tabs[0].classList.add("active");
    tabs[1].classList.remove("active");
}

function showRegister(){
    document.getElementById("registerForm").classList.remove("hidden");
    document.getElementById("loginForm").classList.add("hidden");

    tabs[1].classList.add("active");
    tabs[0].classList.remove("active");
}

</script>

</body>
</html>
